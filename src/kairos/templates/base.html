<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kairos{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --text: #1c1c1a; --muted: #6b6b66;
      --border: #e2e2dd; --accent: #2b59c3; --row: #fafaf8;
      --ok: #1f7a3d; --ok-bg: #e3f4e8; --warn: #8a5a00; --warn-bg: #fdf0d5;
      --crit: #b42318; --crit-bg: #fde7e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --surface: #1f1f1d; --text: #ececea; --muted: #9a9a94;
        --border: #33332f; --accent: #7aa2ff; --row: #232321;
        --ok: #6fd18f; --ok-bg: #16301f; --warn: #f2c066; --warn-bg: #33270f;
        --crit: #ff8a80; --crit-bg: #3a1714;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; align-items: baseline; gap: 12px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px; }
    .brand { font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: .02em; }
    nav { color: var(--muted); font-size: 14px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
             white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
         letter-spacing: .04em; }
    tbody tr:nth-child(even) { background: var(--row); }
    tbody tr:last-child td { border-bottom: 0; }
    td.num { font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
             gap: 12px; padding: 14px; margin-bottom: 16px; }
    .facts dt { color: var(--muted); font-size: 12px; }
    .facts dd { margin: 2px 0 0; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type=search] { flex: 1; max-width: 360px; padding: 8px 10px; font: inherit;
             color: var(--text); background: var(--surface); border: 1px solid var(--border);
             border-radius: 6px; }
    button { padding: 8px 14px; font: inherit; border: 1px solid var(--border);
             border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }
    .empty { padding: 24px; color: var(--muted); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
             font-weight: 600; border: 1px solid transparent; }
    .badge.ok { color: var(--ok); background: var(--ok-bg); }
    .badge.warning { color: var(--warn); background: var(--warn-bg); }
    .badge.critical { color: var(--crit); background: var(--crit-bg); }
    .badge.unknown { color: var(--muted); border-color: var(--border); }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="{{ url_for('index') }}">Kairos</a>
    <nav>{% block nav %}{% endblock %}</nav>
  </div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
